[workspace]
members = [
    "crates/oregon-primitives",
    "crates/oregon-consensus",
    "crates/oregon-pow",
    "crates/oregon-utxo",
    "crates/oregon-storage",
    "crates/oregon-chainstate",
    "crates/oregon-mempool",
    "crates/oregon-protocol",
    "crates/oregon-network",
    "crates/oregon-peer",
    "crates/oregon-sync",
    "crates/oregon-node",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85.0"
