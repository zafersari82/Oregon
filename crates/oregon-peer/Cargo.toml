[package]
name = "oregon-peer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
oregon-network = { path = "../oregon-network" }
oregon-protocol = { path = "../oregon-protocol" }
getrandom = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
