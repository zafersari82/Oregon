[package]
name = "oregon-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
oregon-chainstate = { path = "../oregon-chainstate" }
oregon-mempool = { path = "../oregon-mempool" }
oregon-network = { path = "../oregon-network" }
oregon-peer = { path = "../oregon-peer" }
oregon-primitives = { path = "../oregon-primitives" }
oregon-protocol = { path = "../oregon-protocol" }
oregon-sync = { path = "../oregon-sync" }
oregon-utxo = { path = "../oregon-utxo" }
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
oregon-consensus = { path = "../oregon-consensus" }
