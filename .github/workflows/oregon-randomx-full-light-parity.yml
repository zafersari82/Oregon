name: Oregon RandomX Full Light Parity

on:
  workflow_dispatch:
  push:
    branches: [oregon-v1-m2-randomx-pow-exec, oregon-v1-architecture-unification-2026-09-04, work/contract-state-v1-2026-09-05]
    paths:
      - 'crates/oregon-pow/**'
      - 'crates/oregon-primitives/**'
      - 'vendor/RandomX'
      - '.github/workflows/oregon-randomx-full-light-parity.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/oregon-pow/**'
      - 'crates/oregon-primitives/**'
      - 'vendor/RandomX'
      - '.github/workflows/oregon-randomx-full-light-parity.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'

permissions:
  contents: read

jobs:
  full-light-parity:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Verify RandomX full-light parity
        run: cargo +1.85.0 test --locked -p oregon-pow --test randomx_full_light_parity -- --ignored --nocapture
