name: Oregon M4 Lock Generation

on:
  push:
    branches: [oregon-m4-lockgen-2026-09-03]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Generate lockfile
        run: cargo +1.85.0 generate-lockfile
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: generate M4 rocksdb lockfile"
          git push origin HEAD:oregon-m4-lockgen-2026-09-03
