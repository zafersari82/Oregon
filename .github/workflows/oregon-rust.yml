name: Oregon Rust CI

on:
  push:
    branches: [oregon-v0-protocol]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Test
        run: cargo +1.85.0 test --workspace --all-targets
      - name: Format
        run: cargo +1.85.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.85.0 clippy --workspace --all-targets -- -D warnings
