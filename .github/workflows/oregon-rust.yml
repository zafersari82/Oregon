name: Oregon Rust CI

# Oregon protocol development branches are CI-gated during test-first development.
on:
  push:
    branches: [oregon-v0-protocol, oregon-v1-m1-consensus-core, oregon-v1-m2-randomx-pow, oregon-v1-m2-randomx-pow-exec, oregon-v1-m3-utxo-chainstate, oregon-v1-m4-persistent-chainstate, oregon-v1-m5-mempool, oregon-v1-architecture-unification-2026-09-04, design/m6-network-architecture-2026-09-04, design/execution-envelope-wire-v1-2026-09-05, work/execution-envelope-auth-v1-2026-09-05, design/contract-state-commitments-v1-2026-09-05, work/contract-state-v1-2026-09-05]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Install native and CI scan prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev ripgrep
      - name: Cache Cargo and native build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: oregon-rust-${{ runner.os }}-1.85.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            oregon-rust-${{ runner.os }}-1.85.0-
      - name: Architecture scan
        shell: bash
        run: |
          set -euo pipefail

          for required_contract in \
            AGENTS.md \
            CLAUDE.md \
            GEMINI.md \
            docs/architecture/OREGON_ENGINEERING_CONSTITUTION.md \
            docs/architecture/OREGON_PLATFORM_ARCHITECTURE_CONTRACT.md \
            docs/superpowers/specs/2026-09-05-execution-architecture-design.md \
            docs/superpowers/specs/2026-09-05-execution-envelope-wire-v1.md \
            docs/superpowers/specs/2026-09-05-contract-state-commitments-v1.md; do
            if [[ ! -s "$required_contract" ]]; then
              echo "Required architecture/agent contract is missing or empty: $required_contract" >&2
              exit 1
            fi
          done

          platform_contract=docs/architecture/OREGON_PLATFORM_ARCHITECTURE_CONTRACT.md
          for frozen_heading in \
            '## 2. Frozen decision A — Oregon is Multi-VM by architecture' \
            '## 3. Frozen decision B — Oregon uses a hybrid state model' \
            '## 4. Frozen decision C — future platform transactions use one Oregon universal envelope' \
            '## 5. Frozen decision D — dual external ingress, single internal execution truth'; do
            if ! rg -Fq "$frozen_heading" "$platform_contract"; then
              echo "Frozen platform architecture decision is missing: $frozen_heading" >&2
              exit 1
            fi
          done

          execution_contract=docs/superpowers/specs/2026-09-05-execution-architecture-design.md
          for frozen_heading in \
            '## 9. VM-specific metering with one normalized Oregon weight' \
            '## 10. Dynamic base fee and priority fee, with no fee burn' \
            '## 12. UTXO-backed execution OREG' \
            '## 13. Domain-separated state commitments with one extensible header commitment' \
            '## 14. Separate EVM and WASM state with controlled cross-VM ABI' \
            '## 15. Synchronous atomicity and explicit asynchronous messages' \
            '## 22. Token, NFT, DeFi, privacy, bridge, and AI architecture defaults'; do
            if ! rg -Fq "$frozen_heading" "$execution_contract"; then
              echo "Frozen execution architecture decision is missing: $frozen_heading" >&2
              exit 1
            fi
          done

          state_contract=docs/superpowers/specs/2026-09-05-contract-state-commitments-v1.md
          for frozen_heading in \
            '## 7. Canonical Oregon aggregate state commitment' \
            '## 8. Oregon Sparse Merkle Tree V1' \
            '## 11. Immutable/content-addressed logical state' \
            '## 16. Canonical Sparse Merkle proof V1' \
            '## 21. Current header and transaction bytes remain frozen'; do
            if ! rg -Fq "$frozen_heading" "$state_contract"; then
              echo "Frozen contract-state architecture decision is missing: $frozen_heading" >&2
              exit 1
            fi
          done

          if rg -n 'DeferredTransition|from_persisted_entries|DuplicatePersistedOutpoint|oregon-task[0-9]|mod task[0-9]' crates README.md; then
            echo 'Forbidden legacy architecture symbol or task-numbered production/test path remains.' >&2
            exit 1
          fi

          if rg -n 'encode_(outpoint|utxo|block_undo)|decode_(outpoint|utxo|block_undo)|CF_(BLOCKS|BLOCK_INDEX|UTXO|UNDO|CHAIN_META)' crates --glob '!crates/oregon-storage/**'; then
            echo 'Storage representation leaked outside oregon-storage.' >&2
            exit 1
          fi

          if rg -n 'unsafe[[:space:]]*(fn|impl|trait|extern|\{|\()' crates --glob '!crates/oregon-pow/**'; then
            echo 'Unsafe Rust escaped the oregon-pow boundary.' >&2
            exit 1
          fi

          if rg -n 'oregon-(protocol|network|peer|sync|node)' \
            crates/oregon-consensus/Cargo.toml crates/oregon-utxo/Cargo.toml \
            crates/oregon-storage/Cargo.toml crates/oregon-chainstate/Cargo.toml \
            crates/oregon-mempool/Cargo.toml crates/oregon-contract-state/Cargo.toml; then
            echo 'Core crate depends upward on M6 networking.' >&2
            exit 1
          fi

          if rg -n 'oregon-storage' crates/oregon-contract-state/Cargo.toml; then
            echo 'Logical contract state must remain storage-neutral.' >&2
            exit 1
          fi

          if rg -n 'Vec::with_capacity\((input_count|output_count|witness_count|transaction_count)\)' crates/oregon-primitives/src; then
            echo 'Remote decoder preallocates from attacker count.' >&2
            exit 1
          fi

          if rg -n 'FOUNDER_ALLOCATION_BASE_UNITS|block_subsidy|derive_randomx_key|CF_(BLOCKS|BLOCK_INDEX|UTXO|UNDO|CHAIN_META)' \
            crates/oregon-protocol crates/oregon-network crates/oregon-peer crates/oregon-sync; then
            echo 'Core rule leaked below oregon-node orchestration boundary.' >&2
            exit 1
          fi
      - name: Execution address contracts
        run: cargo +1.85.0 test --locked -p oregon-primitives --test execution_addresses
      - name: Execution envelope contracts
        run: cargo +1.85.0 test --locked -p oregon-primitives --test execution_envelopes --test execution_envelope_security --test execution_envelope_canonical --test execution_envelope_golden_hashes
      - name: State commitment contracts
        run: cargo +1.85.0 test --locked -p oregon-primitives --test state_commitments
      - name: Contract state contracts
        run: cargo +1.85.0 test --locked -p oregon-contract-state --all-targets
      - name: Test
        run: cargo +1.85.0 test --locked --workspace --all-targets
      - name: Execution address mutation gates
        run: python3 scripts/verify_execution_address_mutations.py
      - name: Execution envelope mutation gates
        run: python3 scripts/verify_execution_envelope_mutations.py
      - name: Contract state mutation gates
        run: python3 scripts/verify_contract_state_mutations.py
      - name: Chainstate Rustdoc
        run: cargo +1.85.0 rustdoc --locked -p oregon-chainstate -- -D warnings
      - name: Workspace Docs
        run: cargo +1.85.0 doc --locked --workspace --no-deps
      - name: Format
        run: cargo +1.85.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.85.0 clippy --locked --workspace --all-targets -- -D warnings
