name: Oregon Rust CI

# M1 consensus branch is intentionally CI-gated during test-first development.
on:
  push:
    branches: [oregon-v0-protocol, oregon-v1-m1-consensus-core]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Resolve lockfile
        run: cargo +1.85.0 generate-lockfile
      - name: Pin M1 lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/oregon-v1-m1-consensus-core'
        run: |
          if [ -n "$(git status --porcelain Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: pin Oregon M1 dependency graph"
            git push origin HEAD:oregon-v1-m1-consensus-core
          fi
      - name: Test
        run: cargo +1.85.0 test --workspace --all-targets
      - name: Format
        run: cargo +1.85.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.85.0 clippy --workspace --all-targets -- -D warnings
