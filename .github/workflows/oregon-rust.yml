name: Oregon Rust CI

# Oregon protocol development branches are CI-gated during test-first development.
on:
  push:
    branches: [oregon-v0-protocol, oregon-v1-m1-consensus-core, oregon-v1-m2-randomx-pow, oregon-v1-m2-randomx-pow-exec, oregon-v1-m3-utxo-chainstate]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Generate exact lockfile
        run: cargo +1.85.0 generate-lockfile
      - name: Commit lockfile if changed
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "oregon-ci"
            git config user.email "oregon-ci@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build: pin Oregon M3 workspace lockfile"
            git push origin HEAD:oregon-v1-m3-utxo-chainstate
          fi
      - name: Test
        run: cargo +1.85.0 test --locked --workspace --all-targets
      - name: Format
        run: cargo +1.85.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.85.0 clippy --locked --workspace --all-targets -- -D warnings
