name: Oregon Rust CI

# Oregon protocol development branches are CI-gated during test-first development.
on:
  push:
    branches: [oregon-v0-protocol, oregon-v1-m1-consensus-core, oregon-v1-m2-randomx-pow, oregon-v1-m2-randomx-pow-exec]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Pin Cargo.lock
        run: |
          cargo +1.85.0 generate-lockfile
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build: pin Oregon M2 dependencies"
            git push origin HEAD:oregon-v1-m2-randomx-pow-exec
          fi
      - name: Test
        run: cargo +1.85.0 test --locked --workspace --all-targets
      - name: Format
        run: cargo +1.85.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.85.0 clippy --locked --workspace --all-targets -- -D warnings
