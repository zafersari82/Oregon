name: Oregon Rust CI

# M1 consensus branch is intentionally CI-gated during test-first development.
on:
  push:
    branches: [oregon-v0-protocol, oregon-v1-m1-consensus-core, oregon-v1-m1-mutation-emission-asert]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Test
        run: cargo +1.85.0 test --locked --workspace --all-targets
      - name: Format
        run: cargo +1.85.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.85.0 clippy --locked --workspace --all-targets -- -D warnings
