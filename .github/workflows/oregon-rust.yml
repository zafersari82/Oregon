name: Oregon Rust CI

# Oregon protocol development branches are CI-gated during test-first development.
on:
  push:
    branches: [oregon-v0-protocol, oregon-v1-m1-consensus-core, oregon-v1-m2-randomx-pow, oregon-v1-m2-randomx-pow-exec, oregon-v1-m3-utxo-chainstate, oregon-v1-m4-persistent-chainstate, oregon-v1-m5-mempool, oregon-v1-architecture-unification-2026-09-04]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Install native and CI scan prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev ripgrep
      - name: Cache Cargo and native build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: oregon-rust-${{ runner.os }}-1.85.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            oregon-rust-${{ runner.os }}-1.85.0-
      - name: Architecture scan
        shell: bash
        run: |
          set -euo pipefail

          if rg -n 'DeferredTransition|from_persisted_entries|DuplicatePersistedOutpoint|oregon-task[0-9]|mod task[0-9]' crates README.md; then
            echo 'Forbidden legacy architecture symbol or task-numbered production/test path remains.' >&2
            exit 1
          fi

          if rg -n 'encode_(outpoint|utxo|block_undo)|decode_(outpoint|utxo|block_undo)|CF_(BLOCKS|BLOCK_INDEX|UTXO|UNDO|CHAIN_META)' crates --glob '!crates/oregon-storage/**'; then
            echo 'Storage representation leaked outside oregon-storage.' >&2
            exit 1
          fi

          if rg -n 'unsafe[[:space:]]*(fn|impl|trait|extern|\{|\()' crates --glob '!crates/oregon-pow/**'; then
            echo 'Unsafe Rust escaped the oregon-pow boundary.' >&2
            exit 1
          fi
      - name: Test
        run: cargo +1.85.0 test --locked --workspace --all-targets
      - name: Chainstate Rustdoc
        run: cargo +1.85.0 rustdoc --locked -p oregon-chainstate -- -D warnings
      - name: Workspace Docs
        run: cargo +1.85.0 doc --locked --workspace --no-deps
      - name: Format
        run: cargo +1.85.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.85.0 clippy --locked --workspace --all-targets -- -D warnings
