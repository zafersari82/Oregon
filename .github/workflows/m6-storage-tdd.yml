name: M6 Storage TDD

on:
  push:
    branches: [design/m6-network-architecture-2026-09-04]

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Install RocksDB build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Run Task 2 migration tests
        run: cargo +1.85.0 test --locked -p oregon-storage migration -- --nocapture
