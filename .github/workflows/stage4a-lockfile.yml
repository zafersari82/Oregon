name: Stage 4A Lockfile Refresh

on:
  push:
    branches: [work/runtime-journal-v1-2026-09-06]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore the pre-refresh lock and add only the Stage 4A path edge
        shell: bash
        run: |
          set -euo pipefail
          git show 8e89fa58f07ab2024ac064bc55d3b571f3588ecd:Cargo.lock > Cargo.lock
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Cargo.lock")
          text = path.read_text()
          needle = '''[[package]]
          name = "oregon-execution"
          version = "0.1.0"
          dependencies = [
           "oregon-primitives",
          '''
          replacement = '''[[package]]
          name = "oregon-execution"
          version = "0.1.0"
          dependencies = [
           "oregon-contract-state",
           "oregon-primitives",
          '''
          if text.count(needle) != 1:
              raise SystemExit("oregon-execution lock entry did not match exactly once")
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Verify locked metadata
        run: cargo +1.85.0 metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "chore: normalize Stage 4A lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
