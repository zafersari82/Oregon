name: Oregon Stage 4A Rustfmt Once

on:
  push:
    branches:
      - work/runtime-journal-v1-2026-09-06
    paths:
      - '.github/workflows/oregon-stage4a-rustfmt-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/runtime-journal-v1-2026-09-06
          fetch-depth: 0
      - name: Install Rust 1.85.0 rustfmt
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt
      - name: Apply canonical Rust formatting
        run: cargo +1.85.0 fmt --all
      - name: Commit format-only changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No rustfmt changes required.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style(stage4a): apply canonical rustfmt'
          git push origin HEAD:work/runtime-journal-v1-2026-09-06
