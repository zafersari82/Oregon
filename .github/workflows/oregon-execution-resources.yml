name: Oregon Execution Resource Vectors

on:
  workflow_dispatch:
  push:
    branches: [work/execution-resources-v1-2026-09-06]
  pull_request:
    branches: [main]
    paths:
      - 'crates/oregon-consensus/**'
      - 'crates/oregon-execution/**'
      - 'tests/vectors/execution-resources-v1.json'
      - 'scripts/generate_execution_resource_vectors.py'
      - '.github/workflows/oregon-execution-resources.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'

permissions:
  contents: read

jobs:
  vectors:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Verify independent reference vectors
        run: python3 scripts/generate_execution_resource_vectors.py --check
      - name: Verify consensus fee and block limits
        run: cargo +1.85.0 test --locked -p oregon-consensus --test execution_resources --test execution_resource_vectors
      - name: Verify shared execution meter
        run: cargo +1.85.0 test --locked -p oregon-execution --all-targets
