name: Oregon Runtime Journal Vectors

on:
  workflow_dispatch:
  push:
    branches: [main, work/runtime-journal-v1-2026-09-06]
  pull_request:
    branches: [main]
    paths:
      - 'crates/oregon-execution/**'
      - 'crates/oregon-contract-state/**'
      - 'tests/vectors/journal-v1.json'
      - 'scripts/generate_journal_vectors.py'
      - 'docs/superpowers/specs/2026-09-06-runtime-journal-async-v1-design.md'
      - 'docs/superpowers/plans/2026-09-06-runtime-journal-v1.md'
      - '.github/workflows/oregon-journal.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'

permissions:
  contents: read

jobs:
  vectors:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Verify Stage 4A design and plan presence
        shell: bash
        run: |
          set -euo pipefail
          for required in \
            docs/superpowers/specs/2026-09-06-runtime-journal-async-v1-design.md \
            docs/superpowers/plans/2026-09-06-runtime-journal-v1.md; do
            if [[ ! -s "$required" ]]; then
              echo "Required Stage 4A design/plan is missing or empty: $required" >&2
              exit 1
            fi
          done
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Verify independent journal reference vectors
        run: python3 scripts/generate_journal_vectors.py --check
      - name: Verify bounded journal traces
        run: cargo +1.85.0 test --locked -p oregon-execution --test journal --test journal_security --test journal_vectors
