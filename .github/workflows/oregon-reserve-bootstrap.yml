name: Oregon Reserve Verifier Bootstrap

on:
  push:
    branches: [work/reserve-proof-publication-2026-09-07]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test fail-closed parser and process handling
        run: python3 -m unittest discover -s scripts -p test_verify_reserve_proofs.py
      - name: Install pinned verifier installer
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 install --locked kani-verifier --version 0.67.0
      - name: Download and verify pinned archive before setup
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request
          lock = json.loads(Path('verification/reserve-conservation/toolchain-lock.json').read_text())
          asset = lock['release_asset']
          archive = Path(os.environ['RUNNER_TEMP']) / 'kani-pinned.tar.gz'
          urllib.request.urlretrieve(asset['url'], archive)
          if archive.stat().st_size != asset['size_bytes']:
              raise SystemExit('Kani archive size mismatch')
          with archive.open('rb') as data:
              actual = hashlib.file_digest(data, 'sha256').hexdigest()
          if actual != asset['sha256']:
              raise SystemExit('Kani archive digest mismatch')
          PY
          cargo kani setup --use-local-bundle "$RUNNER_TEMP/kani-pinned.tar.gz"
      - name: Run positive, intended negative and positive again
        run: |
          proof_rustc="$(rustup which --toolchain nightly-2025-11-21-x86_64-unknown-linux-gnu rustc)"
          python3 scripts/verify_reserve_proofs.py --bootstrap \
            --kani-home "$HOME/.kani/kani-0.67.0" \
            --archive "$RUNNER_TEMP/kani-pinned.tar.gz" \
            --rustc "$proof_rustc" \
            --output "$RUNNER_TEMP/reserve-bootstrap-evidence"
      - name: Show bootstrap diagnostics
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/reserve-bootstrap-evidence/summary.json" ]; then
            cat "$RUNNER_TEMP/reserve-bootstrap-evidence/summary.json"
          fi
      - name: Retain bootstrap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reserve-bootstrap-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/reserve-bootstrap-evidence/
          if-no-files-found: error
